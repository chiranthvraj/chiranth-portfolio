services:
  - type: web
    name: little-shop
    runtime: python
    plan: free
    region: singapore
    rootDir: E-commerce webapplication
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shop.local
      - key: ADMIN_PASSWORD
        generateValue: true
