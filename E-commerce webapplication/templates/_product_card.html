<article class="product-card h-100">
  <a class="product-image-wrap" href="{{ url_for('products', q=product.name) }}" aria-label="View {{ product.name }}">
    <img class="product-image" src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">
    {% if product.featured %}<span class="product-tag">Customer favorite</span>{% endif %}
  </a>
  <div class="product-card-body">
    <span class="product-category">{{ product.category }}</span>
    <div class="d-flex justify-content-between align-items-start gap-3">
      <h3 class="product-title">{{ product.name }}</h3>
      <span class="product-price">{{ product.price|money }}</span>
    </div>
    <p class="product-description">{{ product.description }}</p>
    <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-dark w-100 rounded-pill add-button" type="submit">Add to bag <span aria-hidden="true">+</span></button>
    </form>
  </div>
</article>
