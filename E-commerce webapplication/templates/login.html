{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <span class="eyebrow">NICE TO SEE YOU</span>
    <h1>Welcome back.</h1>
    <p>Log in to your Little Shop account.</p>
    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" class="form-control" type="email" name="email" autocomplete="email" required></div>
      <div class="mb-4"><label for="password" class="form-label">Password</label><input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-dark rounded-pill w-100 py-3" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New around here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
