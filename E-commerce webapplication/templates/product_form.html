{% extends "base.html" %}
{% block title %}{{ "Edit product" if product else "Add product" }}{% endblock %}
{% block content %}
<section class="page-header compact-header"><div class="container"><span class="eyebrow">THE COLLECTION</span><h1>{{ "Edit product" if product else "Add something lovely" }}</h1></div></section>
<section class="section-space pt-4">
  <div class="container form-container">
    <form method="post" class="checkout-form product-edit-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3 mb-3">
        <div class="col-md-8"><label class="form-label" for="name">Product name</label><input class="form-control" id="name" name="name" maxlength="120" required value="{{ product.name if product else '' }}"></div>
        <div class="col-md-4"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required>{% for category in ("Bicycles", "Helmets", "Books", "Gadgets", "Phones", "Laptops", "Other") %}<option value="{{ category }}" {% if product and product.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}{% if product and product.category not in ("Bicycles", "Helmets", "Books", "Gadgets", "Phones", "Laptops", "Other") %}<option value="{{ product.category }}" selected>{{ product.category }}</option>{% endif %}</select></div>
      </div>
      <div class="mb-3"><label class="form-label" for="description">Short description</label><textarea class="form-control" id="description" name="description" rows="3" maxlength="500" required>{{ product.description if product else '' }}</textarea></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="price">Price (INR ₹)</label><input class="form-control" id="price" name="price" type="number" min="0.01" step="0.01" required value="{{ product.price if product else '' }}"></div>
        <div class="col-md-6"><label class="form-label" for="stock">Available stock</label><input class="form-control" id="stock" name="stock" type="number" min="0" step="1" required value="{{ product.stock if product else '10' }}"></div>
      </div>
      <div class="mt-3 mb-3"><label class="form-label" for="image_url">Product image URL</label><input class="form-control" id="image_url" name="image_url" type="url" maxlength="500" required value="{{ product.image_url if product else '' }}" placeholder="https://example.com/product.jpg"></div>
      <div class="form-check mb-4"><input class="form-check-input" id="featured" name="featured" type="checkbox" {% if product and product.featured %}checked{% endif %}><label class="form-check-label" for="featured">Show on the home page</label></div>
      <div class="d-flex gap-3"><button class="btn btn-dark rounded-pill px-4 py-3" type="submit">Save product</button><a class="btn btn-outline-dark rounded-pill px-4 py-3" href="{{ url_for('admin_dashboard') }}">Cancel</a></div>
    </form>
  </div>
</section>
{% endblock %}
