{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <span class="eyebrow">MAKE YOURSELF AT HOME</span>
    <h1>Let's get acquainted.</h1>
    <p>Create an account to make checkout a little easier.</p>
    <form method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label for="name" class="form-label">Your name</label><input id="name" class="form-control" name="name" maxlength="100" autocomplete="name" required></div>
      <div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" class="form-control" type="email" name="email" maxlength="120" autocomplete="email" required></div>
      <div class="mb-4"><label for="password" class="form-label">Password</label><input id="password" class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required><div class="form-text">Use at least 8 characters.</div></div>
      <button class="btn btn-dark rounded-pill w-100 py-3" type="submit">Create my account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
